# Exam Forge — nginx reverse proxy (один из вариантов; вместо него можно использовать Caddy).
# Установка: копируйте в /etc/nginx/sites-available/examforge.conf, сделайте symlink
# в sites-enabled, сертификаты создаёт certbot --nginx (или вы заранее положили fullchain/privkey).
# Дополнение: контейнер Exam Forge слушает http://127.0.0.1:8080 — Internet напрямую
# на 8080 нет (в compose порт публикуется только на 127.0.0.1).

# Корректное Connection: upgrade/keep-alive для websockets (Blazor Server circuit).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: только редирект на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name examforge.example.com;

    # ACME-испытание certbot'а не перенаправляем.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: основной сервер.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name examforge.example.com;

    # Сертификаты (самоподписанный пример — замените на certbot/le fullchain+privkey).
    ssl_certificate     /etc/letsencrypt/live/examforge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examforge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Загрузки материалов/сканов (PDF) — ограничение сверху по лимиту приложения.
    client_max_body_size 100m;

    # Blazor Server (SignalR) и студенческие SSE — долгий полупостоянный трафик.
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_buffering       off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Websockets/SignalR negotiate: заголовки апгрейда.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}
