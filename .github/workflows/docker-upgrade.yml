name: Docker upgrade and rollback

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Docker upgrade, E2E and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Rehearse upgrade and rollback
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash deploy/docker/test-upgrade.sh "$BASE_SHA"
